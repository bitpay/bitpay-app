name: Android Espresso E2E

on:
  workflow_dispatch:
  push:
    branches: [master, develop, testlio/ui-tests]
  pull_request:
    branches: [master, develop, testlio/ui-tests]

concurrency:
  group: e2e-android-espresso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-espresso-tests:
    name: Android Espresso UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create env file
        env:
          ENV_FILE: ${{ secrets.ENV_DEVELOPMENT }}
        run: |
          echo "$ENV_FILE" > .env.development

      - name: Create Sentry properties
        run: |
          echo "${{ secrets.SENTRY_PROPERTIES }}" > sentry.properties
          echo "${{ secrets.SENTRY_PROPERTIES }}" > android/sentry.properties

      - name: Set native config values
        run: yarn set:dev

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build only the x86_64 ABI for this run. The full default ABI list
      # (armeabi-v7a, x86, x86_64, arm64-v8a) includes a 32-bit x86 build that
      # fails to link against react-native-nitro-modules / react-native-quick-crypto
      # (undefined symbol: margelo::nitro::...). x86_64 matches the CI emulator's
      # actual architecture, so the other three ABIs are unnecessary for this job.
      # This is passed as a one-off Gradle property here rather than committed to
      # android/gradle.properties, since that file is shared dev configuration.
      - name: Build debug APK and test APK
        run: |
          cd android
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -PreactNativeArchitectures=x86_64 \
            --no-daemon

      - name: Start Android emulator and run Espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: e2e-emulator
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd android
            ./gradlew connectedDebugAndroidTest \
              -PreactNativeArchitectures=x86_64 \
              --no-daemon

      # Allure results are written via TestStorage to /sdcard/googletest/test_outputfiles
      # rather than the app's internal /data/data/<package>/files directory, because the
      # app gets reinstalled/uninstalled between connectedDebugAndroidTest invocations,
      # which wipes internal app storage before results can be pulled.
      - name: Pull Allure results from device
        if: always()
        run: |
          mkdir -p allure-results
          adb exec-out sh -c 'cd /sdcard/googletest/test_outputfiles && tar cf - allure-results' \
            | tar xvf - -C allure-results --strip-components=1 || true

      - name: Check Allure results were produced
        if: always()
        run: |
          if [ -z "$(find allure-results -name '*.json' 2>/dev/null)" ]; then
            echo "::warning::No Allure result JSON files found under allure-results/"
          else
            echo "Allure results found:"
            find allure-results -name '*.json'
          fi

      # Espresso/instrumentation JUnit XML reports for raw pass/fail visibility,
      # independent of whether Allure conversion succeeds.
      - name: Upload raw Espresso test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: espresso-android-results
          path: android/app/build/outputs/androidTest-results/connected/
          retention-days: 7

      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          curl -fLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure

      # Zip Allure raw results
      - name: Zip Allure Results
        if: always()
        run: |
          zip -r allure-results.zip allure-results

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results.zip
          retention-days: 7

      - name: Generate Allure HTML Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-html-report
          path: allure-report
          retention-days: 7

      - name: Install Testlio CLI
        if: always()
        run: npm install -g @testlio/cli

      - name: Upload Results to Testlio
        if: always()
        env:
          RUN_API_TOKEN: ${{ secrets.TESTLIO_RUN_TOKEN }}
          TESTLIO_DEVICE_ID: 363a5ce7-6cef-436c-8531-6c07195c8fe8
        run: |
          testlio create-run \
            --testConfig testlio-cli/test-config.json \
            --projectConfig testlio-cli/project-config.json \
            --externalResults true \
            --resultProvider local \
            --automatedDeviceIds "$TESTLIO_DEVICE_ID"

          testlio parse-run-results \
            --projectConfig testlio-cli/project-config.json \
            --path allure-results.zip \
            --automatedDeviceId "$TESTLIO_DEVICE_ID"

          testlio finalize-results \
            --projectConfig testlio-cli/project-config.json