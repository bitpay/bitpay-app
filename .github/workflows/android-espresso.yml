name: Android Espresso E2E

on:
  workflow_dispatch:
  push:
    branches: [master, develop, testlio/ui-tests]
  pull_request:
    branches: [master, develop, testlio/ui-tests]

concurrency:
  group: e2e-android-espresso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-espresso-tests:
    name: Android Espresso UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create env file
        env:
          ENV_FILE: ${{ secrets.ENV_DEVELOPMENT }}
        run: echo "$ENV_FILE" > .env.development

      - name: Create Sentry properties
        run: |
          echo "${{ secrets.SENTRY_PROPERTIES }}" > sentry.properties
          echo "${{ secrets.SENTRY_PROPERTIES }}" > android/sentry.properties

      - name: Set native config values
        run: yarn set:dev

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Metro bundler
        run: |
          npx react-native start &
          echo $! > /tmp/metro.pid
          npx wait-on http://localhost:8081/status --timeout 60000

      - name: Build debug APK and test APK
        run: |
          cd android
          ./gradlew assembleDebug assembleDebugAndroidTest \
            -PreactNativeArchitectures=x86_64 \
            --no-daemon

      - name: Start Android emulator and run Espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 55
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: e2e-emulator
          # BUG 3 FIX: added -memory 4096 to give the guest more RAM.
          # The previous run OOM-killed com.bitpay.wallet (1.5 GB RSS) during
          # Test596, so its result.json was never written. More guest RAM
          # reduces that pressure on the 7 GB ubuntu-latest host.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat > /home/runner/work/_temp/device-logcat.txt &
            LOGCAT_PID=$!
            adb reverse tcp:8081 tcp:8081
            # Allow test to finish even if one test OOMs; Gradle exit code is
            # captured and re-applied after cleanup so the step still fails correctly.
            cd android && ./gradlew connectedDebugAndroidTest -PreactNativeArchitectures=x86_64 --no-daemon; GRADLE_EXIT=$?
            kill $LOGCAT_PID || true
            exit $GRADLE_EXIT

      - name: Stop Metro bundler
        if: always()
        run: kill $(cat /tmp/metro.pid) || true

      - name: Debug - list TestStorage contents on device
        if: always()
        timeout-minutes: 2
        run: |
          adb exec-out sh -c 'find /sdcard/googletest/test_outputfiles -type f 2>&1' || echo "device unavailable or path does not exist"

      - name: Pull Allure results from device
        if: always()
        timeout-minutes: 3
        run: |
          # BUG 1 FIX: Use `adb pull` instead of `adb exec-out tar`.
          #
          # The previous approach ran `tar cf -` as the adb shell user, which
          # cannot read /sdcard/googletest/test_outputfiles on API 34 — that
          # path is owned by androidx.test.services. The tar archive succeeded
          # but contained only the empty directory stub (0 bytes), so no JSON
          # files ever reached the runner and allure-results/ stayed empty.
          #
          # `adb pull` uses the ADB file-sync protocol, which runs as root in
          # the emulator and can read the path correctly.
          mkdir -p allure-results
          adb pull /sdcard/googletest/test_outputfiles/allure-results/. allure-results/ || true

          echo "=== Files pulled from device ==="
          find allure-results -type f || echo "nothing pulled"

      - name: Check Allure results were produced
        if: always()
        run: |
          if [ -z "$(find allure-results -name '*.json' 2>/dev/null)" ]; then
            echo "::warning::No Allure result JSON files found under allure-results/"
          else
            echo "Allure results found:"
            find allure-results -name '*.json'
          fi

      - name: Upload device logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-logcat
          path: /home/runner/work/_temp/device-logcat.txt
          retention-days: 7

      - name: Upload raw Espresso test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espresso-android-results
          path: android/app/build/outputs/androidTest-results/connected/
          retention-days: 7

      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q default-jre-headless
          curl -fLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure

      - name: Zip Allure Results
        if: always()
        run: |
          # BUG 2 FIX: Remove any stale allure-results.zip before re-creating.
          # The previous run left a zip from the failed tar-pull step, so when
          # this step ran `zip -r allure-results.zip allure-results/`, the old
          # zip was included inside the new one. Testlio then opened the outer
          # zip and found another zip instead of JSON files.
          rm -f allure-results.zip
          zip -r allure-results.zip allure-results/
          echo "=== Zip contents ==="
          unzip -l allure-results.zip | head -30

      - name: Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results.zip
          retention-days: 7

      - name: Generate Allure HTML Report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report
          retention-days: 7

      - name: Install Testlio CLI
        if: always()
        run: npm install -g @testlio/cli

      - name: Upload Results to Testlio
        if: always()
        env:
          RUN_API_TOKEN: ${{ secrets.TESTLIO_RUN_TOKEN }}
          TESTLIO_DEVICE_ID: 363a5ce7-6cef-436c-8531-6c07195c8fe8
        run: |
          testlio create-run \
            --testConfig testlio-cli/test-config.json \
            --projectConfig testlio-cli/project-config.json \
            --externalResults true \
            --resultProvider local \
            --automatedDeviceIds "$TESTLIO_DEVICE_ID"

          testlio parse-run-results \
            --projectConfig testlio-cli/project-config.json \
            --path allure-results.zip \
            --automatedDeviceId "$TESTLIO_DEVICE_ID"

          testlio finalize-results \
            --projectConfig testlio-cli/project-config.json