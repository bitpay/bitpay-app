// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 30
        compileSdkVersion = 36
        targetSdkVersion = 36
        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "27.1.12297006"
        androidXAnnotation = "1.2.0"
        androidXBrowser = "1.3.0"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.android.gms:strict-version-matcher-plugin:1.2.1'
        classpath 'com.google.gms:google-services:4.3.14'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven { url "https://appboy.github.io/appboy-android-sdk/sdk" }
        maven { url "https://dl.appsflyer.com" }
    }
}

// Multiple third-party RN libraries ship an androidTest manifest with a
// stale minSdkVersion (21), conflicting with react-android 0.82.0's required
// 24+. Using gradle.afterProject (rather than subprojects { afterEvaluate })
// because the React Native Gradle Plugin's own autolinking logic evaluates
// some subprojects internally during apply, before a subprojects{} block's
// afterEvaluate hook would otherwise have a chance to register.
gradle.afterProject { proj ->
    if (proj != rootProject && proj.hasProperty('android')) {
        proj.android {
            if (defaultConfig.minSdkVersion == null || defaultConfig.minSdkVersion.apiLevel < 24) {
                defaultConfig {
                    minSdkVersion 24
                }
            }

            // Several third-party RN libraries (confirmed: react-native-keyevent)
            // hardcode an outdated compileSdkVersion (31), which conflicts with
            // AndroidX libraries (appcompat, core-ktx, lifecycle-*) requiring
            // compileSdk 33/34+. Raise compileSdk to match our app's own value
            // (36) for any subproject compiling against something lower.
            if (compileSdkVersion == null || (compileSdkVersion as String).replace("android-", "").toInteger() < 34) {
                compileSdkVersion 36
            }

            if (proj.name == 'react-native-gesture-handler') {
                packagingOptions {
                    pickFirst 'lib/*/libfbjni.so'
                }
            }
        }
    }
}