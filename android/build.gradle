// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 30
        compileSdkVersion = 36
        targetSdkVersion = 36
        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "27.1.12297006"
        androidXAnnotation = "1.2.0"
        androidXBrowser = "1.3.0"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.android.gms:strict-version-matcher-plugin:1.2.1'
        classpath 'com.google.gms:google-services:4.3.14'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven { url "https://appboy.github.io/appboy-android-sdk/sdk" }
        maven { url "https://dl.appsflyer.com" }
    }
}
// Multiple third-party RN libraries (confirmed so far: mixpanel-react-native,
// react-native-keyevent) ship an androidTest manifest declaring minSdkVersion
// 21, conflicting with react-android 0.82.0's required 24+. Rather than patch
// each affected module individually as CI discovers them, this applies the
// same override to every subproject's androidTest manifest at once. Does not
// change any subproject's source code or our app's own minSdkVersion (still 30).
subprojects {
    afterEvaluate { subproject ->
        if (subproject.hasProperty('android')) {
            subproject.android {
                if (defaultConfig.minSdkVersion == null || defaultConfig.minSdkVersion.apiLevel < 24) {
                    defaultConfig {
                        minSdkVersion 24
                    }
                }
            }
        }
    }
}

// react-native-gesture-handler's own androidTest build merges native libs and
// finds two copies of libfbjni.so (its own bundled copy + react-android's),
// causing :react-native-gesture-handler:mergeDebugAndroidTestNativeLibs to
// fail. Different conflict category than the minSdk fix above (native lib
// duplication, not manifest merge), so it needs its own override.
project(':react-native-gesture-handler') {
    afterEvaluate {
        android {
            packagingOptions {
                pickFirst 'lib/*/libfbjni.so'
            }
        }
    }
}