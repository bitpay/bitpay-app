// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 30
        compileSdkVersion = 37
        targetSdkVersion = 36
        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "27.1.12297006"
        androidXAnnotation = "1.2.0"
        androidXBrowser = "1.3.0"
        kotlinVersion = "2.2.0"
        // Cronet 141 shares org.chromium.net across several AARs, which AGP 9
        // rejects. 143 is the first upstream release with unique namespaces.
        cronetVersion = "143.7445.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.android.gms:strict-version-matcher-plugin:1.2.1'
        classpath 'com.google.gms:google-services:4.3.14'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven { url "https://appboy.github.io/appboy-android-sdk/sdk" }
        maven { url "https://maven.sumsub.com/repository/maven-public/" }
        maven { url "https://dl.appsflyer.com" }
    }
}

// Strip absolute build-machine paths (home dir + developer username)
subprojects { subproject ->
    def injectPrefixMap = {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt == null) return
        def release = androidExt.buildTypes.findByName('release')
        if (release == null) return
        def prefixMap = "-ffile-prefix-map=${rootDir.parentFile.absolutePath}/=./".toString()
        release.externalNativeBuild.cmake.cppFlags.add(prefixMap)
        release.externalNativeBuild.cmake.cFlags.add(prefixMap)
    }
    if (subproject.state.executed) {
        injectPrefixMap()
    } else {
        subproject.afterEvaluate { injectPrefixMap() }
    }
}
