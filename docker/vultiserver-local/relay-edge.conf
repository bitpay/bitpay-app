events {}

http {
  access_log off;
  keepalive_timeout 0;
  # Vultisig relay namespaces MPC setup and protocol messages with the
  # `message_id` header. Nginx drops underscore headers unless explicitly
  # enabled, which makes the local client and server read different slots.
  underscores_in_headers on;

  server {
    listen 8080;

    location / {
      proxy_pass http://relay:8080;
      proxy_http_version 1.0;
      proxy_set_header Host $host;
      proxy_set_header Connection close;
      proxy_buffering on;
      proxy_request_buffering on;
      add_header Cache-Control "no-store" always;
    }
  }
}
